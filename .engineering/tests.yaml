version: 1
setup_command: ''
paths:
  appliance/**:
    domains:
    - core
  bootstrap/**:
    domains:
    - core
  config/**:
    domains:
    - core
  detection-scenario-platform/**:
    domains:
    - core
  scripts/**:
    domains:
    - core
  stellar_*.py:
    domains:
    - core
  stellar_*.sh:
    domains:
    - core
  xdr-lab.sh:
    domains:
    - core
  tests/**:
    domains:
    - core
scenarios:
- id: ADOPTED-TEST-001
  cost: cheap
  estimated_seconds: 15
  timeout_seconds: 120
  agent_default: true
  scope: integration
  name: Fast native XDR Lab regression
  level: integration
  domains:
  - core
  triggers:
  - affected
  platforms:
  - linux
  command: bash tests/test_appliance_privilege.sh && bash tests/test_caldera_api_key_resolve.sh
    && bash tests/test_caldera_config_diag.sh && bash tests/test_caldera_http_auth.sh
    && bash tests/test_caldera_process_util.sh
  invariants:
  - representative native appliance and Caldera integration tests remain green
  release_gate: false
- id: ADOPTED-STATIC-001
  cost: cheap
  estimated_seconds: 2
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Git whitespace validation
  level: static
  domains:
  - core
  triggers:
  - pr
  - preflight
  - release
  platforms:
  - linux
  command: bash -lc 'if [ -n "${ENGINEERING_BASE_REF:-}" ]; then git diff --check
    "${ENGINEERING_BASE_REF}...HEAD"; elif git rev-parse --verify --quiet origin/main
    >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify
    --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse
    --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git
    diff --check; fi'
  invariants:
  - committed candidate/base diff has no whitespace errors
  release_gate: true
